function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' +
    d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function formatDateLong(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);

function dayLabelFromDate(dateStr) {
  const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return days[d.getDay()];
}

  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  return `LC-${now.getFullYear()}${mm}-${code}`;
}

// Approximate real-world distances for known intercontinental pairs (km).
// Domestic French routes keep using the pseudo-random estimate below —
// only the Sénégal <-> France corridor needs a realistic anchor so pricing
// doesn't look like a cheap domestic delivery.
const KNOWN_DISTANCES_KM = {
  'dakar|paris': 4200, 'paris|dakar': 4200,
  'dakar|marseille': 4300, 'marseille|dakar': 4300,
  'dakar|lyon': 4450, 'lyon|dakar': 4450,
};

function estimateDistanceKm(pickupCity, dropoffCity) {
  if (!pickupCity || !dropoffCity) return 25;
  const a = pickupCity.trim().toLowerCase();
  const b = dropoffCity.trim().toLowerCase();
  if (a === b) return 8;
  const known = KNOWN_DISTANCES_KM[`${a}|${b}`];
  if (known) return known;
  let hash = 0;
  const s = a + '|' + b;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return 12 + (hash % 340);
}

function computePrice(carrier, distanceKm, fragile) {
  let total = carrier.basePrice + carrier.pricePerKm * distanceKm;
  if (fragile) total += 8;
  return Math.round(total * 100) / 100;
}

/* ======================================================================
   HASH ROUTER (no router library — plain window.location.hash)
   ====================================================================== */

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const [screen, qs] = raw.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  return { screen: screen || 'home', params };
}

function buildHash(screen, params) {
  const cleaned = Object.fromEntries(Object.entries(params || {}).filter(([, v]) => v !== undefined && v !== null && v !== ''));
  const qs = new URLSearchParams(cleaned).toString();
  return `#/${screen}${qs ? '?' + qs : ''}`;
}

  function sendMessage(carrierId, text, sender = 'client') {
    const msg = { id: 'm' + Date.now() + Math.random().toString(16).slice(2), sender, text, time: new Date().toISOString() };
    setThreads(prev => ({ ...prev, [carrierId]: [...(prev[carrierId] || []), msg] }));
    return msg;
  }

  function simulateCarrierReply(carrierId, delay = 1400) {
    setTypingCarrierId(carrierId);
    setTimeout(() => {
      const reply = CARRIER_REPLIES[Math.floor(Math.random() * CARRIER_REPLIES.length)];
      sendMessage(carrierId, reply, 'carrier');
      setTypingCarrierId(null);
    }, delay);
  }

  function createBooking(carrierId, data) {
    const carrier = getCarrier(carrierId);
    const distanceKm = estimateDistanceKm(data.pickup.city, data.dropoff.city);
    const price = computePrice(carrier, distanceKm, data.fragile);
    const now = new Date().toISOString();
    const booking = {
      id: 'bk_' + Date.now(),
      ref: generateBookingRef(),
      carrierId,
      pickup: data.pickup,
      dropoff: data.dropoff,
      packageType: data.packageType,
      weight: data.weight,
      dimensions: data.dimensions,
      fragile: data.fragile,
      description: data.description,
      date: data.date,
      timeWindow: data.timeWindow,
      distanceKm,
      price,
      status: 'booked',
      confirmationCode: generateConfirmationCode(),
      createdAt: now,
      statusHistory: [{ status: 'booked', at: now }],
    };
    setBookings(prev => [booking, ...prev]);

    // Bridge into messaging: notify the carrier automatically
    const summary = `Bonjour, je viens de réserver une livraison avec vous (réf. ${booking.ref}) — de ${data.pickup.city} à ${data.dropoff.city}, le ${formatDateLong(data.date)} (${data.timeWindow}). Merci de me confirmer !`;
    sendMessage(carrierId, summary, 'client');
    simulateCarrierReply(carrierId, 1600);

    return booking;
  }

  function advanceBookingStatus(bookingId) {
    setBookings(prev => prev.map(b => {
      if (b.id !== bookingId) return b;
      const idx = STATUS_ORDER.indexOf(b.status);
      if (idx >= STATUS_ORDER.length - 1) return b;
      const nextStatus = STATUS_ORDER[idx + 1];
      const now = new Date().toISOString();
      return { ...b, status: nextStatus, statusHistory: [...b.statusHistory, { status: nextStatus, at: now }] };
    }));
  }

  const value = {
    carriers: CARRIERS,
    getCarrier,
    bookings,
    createBooking,
    advanceBookingStatus,
    threads,
    sendMessage,
    simulateCarrierReply,
    typingCarrierId,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function filterCarriers(carriers, filters) {
  return carriers.filter(c => {
    if (filters.pickupCity) {
      const q = filters.pickupCity.toLowerCase();
      const ok = c.city.toLowerCase().includes(q) || c.zonesServed.some(z => z.toLowerCase().includes(q));
      if (!ok) return false;
    }
    if (filters.dropoffCity) {
      const q = filters.dropoffCity.toLowerCase();
      const ok = c.city.toLowerCase().includes(q) || c.zonesServed.some(z => z.toLowerCase().includes(q));
      if (!ok) return false;
    }
    if (filters.packageTypes.length > 0) {
      const ok = filters.packageTypes.some(pt => c.packageTypes.includes(pt));
      if (!ok) return false;
    }
    if (filters.vehicle !== 'all' && c.vehicle !== filters.vehicle) return false;
    if (c.basePrice > filters.maxPrice) return false;
    if (filters.date) {
      const day = dayLabelFromDate(filters.date);
      if (day && !c.availableDays.includes(day)) return false;
    }
    if (filters.timeWindow !== 'all' && !c.timeWindows.includes(filters.timeWindow)) return false;
    return true;
  });
}

function SearchPage({ params }) {
  const { carriers } = useApp();
  const { navigate } = useApp2();
  const [filters, setFilters] = useState({
    pickupCity: params.pickupCity || '',
    dropoffCity: params.dropoffCity || '',
    date: params.date || '',
    timeWindow: 'all',
    packageTypes: [],
    vehicle: 'all',
    maxPrice: 70,
  });
  const [sort, setSort] = useState('rating_desc');
  const [showFilters, setShowFilters] = useState(false);

  const results = useMemo(() => {
    const list = filterCarriers(carriers, filters);
    const sorted = [...list];
    if (sort === 'rating_desc') sorted.sort((a, b) => b.rating - a.rating);
    if (sort === 'price_asc') sorted.sort((a, b) => a.basePrice - b.basePrice);
    if (sort === 'price_desc') sorted.sort((a, b) => b.basePrice - a.basePrice);
    return sorted;
  }, [carriers, filters, sort]);

  return (
    <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div className="mb-6">
        <h1 className="text-2xl font-extrabold text-slate-900">Transporteurs disponibles</h1>
        <p className="mt-1 text-sm text-slate-500">
          {filters.pickupCity || filters.dropoffCity
            ? <>Trajet : <strong>{filters.pickupCity || 'Toute ville'}</strong> → <strong>{filters.dropoffCity || 'Toute ville'}</strong></>
            : "Parcourez l'ensemble des transporteurs partenaires."}
        </p>
      </div>

      <button onClick={() => setShowFilters(s => !s)} className="mb-4 inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 lg:hidden">
        🎛️ Filtres {showFilters ? '▲' : '▼'}
      </button>

      <div className="grid gap-8 lg:grid-cols-[280px_1fr]">
        <aside className={cx(showFilters ? 'block' : 'hidden', 'lg:block')}>
          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-card lg:sticky lg:top-20">
            <FilterPanel filters={filters} setFilters={setFilters} />
          </div>
        </aside>

        <div>
          <div className="mb-4 flex items-center justify-between">
            <p className="text-sm text-slate-500">{results.length} transporteur{results.length !== 1 ? 's' : ''} trouvé{results.length !== 1 ? 's' : ''}</p>
            <select className={cx(inputClass, 'w-auto')} value={sort} onChange={e => setSort(e.target.value)}>
              <option value="rating_desc">Mieux notés</option>
              <option value="price_asc">Prix croissant</option>
              <option value="price_desc">Prix décroissant</option>
            </select>
          </div>

          {results.length === 0 ? (
            <div className="rounded-2xl border border-dashed border-slate-300 bg-white p-12 text-center">
              <div className="text-4xl">🔍</div>
              <h3 className="mt-3 text-base font-bold text-slate-800">Aucun transporteur ne correspond à vos critères</h3>
              <p className="mt-1 text-sm text-slate-500">Essayez d'élargir votre recherche ou de réinitialiser les filtres.</p>
            </div>
          ) : (
            <div className="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
              {results.map(c => <CarrierCard key={c.id} carrier={c} />)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const BOOKING_STEPS = ['Adresses', 'Colis', 'Date & heure', 'Récapitulatif'];

function StepIndicator({ step }) {
  return (
    <div className="mb-8 flex items-center">
      {BOOKING_STEPS.map((label, i) => {
        const idx = i + 1;
        const done = idx < step;
        const current = idx === step;
        return (
          <React.Fragment key={label}>
            <div className="flex flex-col items-center">
              <div className={cx('flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold transition',
                done ? 'bg-brand-600 text-white' : current ? 'bg-brand-600 text-white ring-4 ring-brand-100' : 'bg-slate-100 text-slate-400')}>
                {done ? '✓' : idx}
              </div>
              <span className={cx('mt-1.5 hidden text-xs font-semibold sm:block', current || done ? 'text-slate-700' : 'text-slate-400')}>{label}</span>
            </div>
            {idx < BOOKING_STEPS.length && <div className={cx('mx-2 h-0.5 flex-1', done ? 'bg-brand-600' : 'bg-slate-100')}></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function BookingPage({ params }) {
  const { getCarrier, createBooking } = useApp();
  const { navigate } = useApp2();
  const carrier = getCarrier(params.carrierId);

  const [step, setStep] = useState(1);
  const [createdBooking, setCreatedBooking] = useState(null);
  const [form, setForm] = useState({
    pickup: { address: '', city: carrier ? carrier.city : '', postalCode: '' },
    dropoff: { address: '', city: '', postalCode: '' },
    packageType: 'petit_colis',
    weight: '',
    dimensions: '',
    fragile: false,
    description: '',
    date: todayISO(),
    timeWindow: 'Matin',
    acceptTerms: false,
  });

  if (!carrier) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center">
        <p className="text-lg font-semibold text-slate-700">Transporteur introuvable.</p>
        <SecondaryButton className="mt-4" onClick={() => navigate('search')}>Retour à la recherche</SecondaryButton>
      </div>
    );
  }

  const distanceKm = estimateDistanceKm(form.pickup.city, form.dropoff.city);
  const price = computePrice(carrier, distanceKm, form.fragile);
  const isInternational = carrier.vehicle === 'avion' || carrier.vehicle === 'bateau';

  function isStepValid(s) {
    if (s === 1) return form.pickup.address && form.pickup.city && form.dropoff.address && form.dropoff.city;
    if (s === 2) return form.packageType && form.weight;
    if (s === 3) return form.date && form.timeWindow;
    return true;
  }

  function confirmBooking() {
    const booking = createBooking(carrier.id, form);
    setCreatedBooking(booking);
    setStep(5);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (step === 5 && createdBooking) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-14 sm:px-6">
        <div className="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-card animate-fade-in-up">

          <h1 className="mt-4 text-2xl font-extrabold text-slate-900">Réservation confirmée !</h1>
          <p className="mt-1 text-sm text-slate-500">Votre demande a bien été envoyée à {carrier.name}.</p>

          <div className="mt-6 rounded-xl bg-slate-50 p-5 text-left">
            <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Référence de réservation</p>
            <p className="mt-1 font-mono text-xl font-extrabold text-brand-700">{createdBooking.ref}</p>
            <div className="mt-4 grid gap-2 text-sm text-slate-600 sm:grid-cols-2">
              <p><strong className="text-slate-800">Trajet :</strong> {form.pickup.city} → {form.dropoff.city}</p>
              <p><strong className="text-slate-800">Date :</strong> {formatDateLong(form.date)}</p>
              <p><strong className="text-slate-800">Créneau :</strong> {form.timeWindow}</p>
              <p><strong className="text-slate-800">Prix estimé :</strong> {euros(price)}</p>
              {carrier.deliveryEstimate && <p className="sm:col-span-2"><strong className="text-slate-800">Délai de livraison estimé :</strong> {carrier.deliveryEstimate}</p>}
            </div>
          </div>

          <div className="mt-6 flex flex-col gap-2.5">
            <PrimaryButton onClick={() => navigate('tracking', { bookingId: createdBooking.id })}>📍 Voir le suivi de ma livraison</PrimaryButton>
            <SecondaryButton onClick={() => navigate('messaging', { carrierId: carrier.id })}>💬 Envoyer un message au transporteur</SecondaryButton>
            <button onClick={() => navigate('dashboard')} className="mt-1 text-sm font-semibold text-slate-500 hover:text-brand-700">Aller à mon tableau de bord →</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8">

          <p className="text-xs text-slate-500">{carrier.city} · {VEHICLES[carrier.vehicle].label}</p>

            </div>

            <label className="flex items-start gap-2.5">
              <input type="checkbox" checked={form.acceptTerms} onChange={e => setForm(f => ({ ...f, acceptTerms: e.target.checked }))}
                className="mt-0.5 h-4 w-4 rounded accent-brand-600" />
              <span className="text-sm text-slate-600">J'accepte les conditions générales d'utilisation et confirme l'exactitude des informations fournies pour cette demande de livraison.</span>
            </label>
          </div>
        )}

        <div className="mt-8 flex items-center justify-between border-t border-slate-100 pt-6">
          <SecondaryButton onClick={() => setStep(s => Math.max(1, s - 1))} disabled={step === 1}>← Précédent</SecondaryButton>
          {step < 4 ? (
            <PrimaryButton onClick={() => setStep(s => s + 1)} disabled={!isStepValid(step)}>Continuer →</PrimaryButton>
          ) : (
            <PrimaryButton onClick={confirmBooking} disabled={!form.acceptTerms}>✅ Confirmer la demande</PrimaryButton>
          )}
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   DASHBOARD PAGE

      {bookings.length === 0 ? (
        <div className="mt-8 rounded-2xl border border-dashed border-slate-300 bg-white p-14 text-center">

          <p className="mt-1 text-sm text-slate-500">Recherchez un transporteur pour créer votre première demande de livraison.</p>
          <PrimaryButton className="mx-auto mt-5" onClick={() => navigate('search')}>Rechercher un transporteur</PrimaryButton>

                <div className="flex items-center gap-4">
                  <Avatar name={carrier.name} initials={carrier.initials} size={11} />
                  <div>

                  <p className="text-sm font-bold text-slate-800">{euros(b.price)}</p>

/* ======================================================================
   TRACKING PAGE
   ====================================================================== */

function StatusStepper({ booking }) {
  const currentIdx = STATUS_ORDER.indexOf(booking.status);
  return (
    <div className="flex flex-col gap-0 sm:flex-row sm:items-start">
      {STATUS_ORDER.map((s, i) => {
        const done = i <= currentIdx;
        const entry = booking.statusHistory.find(h => h.status === s);
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-3 sm:flex-1 sm:flex-col sm:items-center sm:text-center">
              <div className={cx('flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-lg transition',
                done ? 'bg-brand-600 text-white shadow-sm' : 'bg-slate-100 text-slate-400')}>
                {STATUS_ICONS[s]}
              </div>
              <div className="sm:mt-2">
                <p className={cx('text-sm font-bold', done ? 'text-slate-900' : 'text-slate-400')}>{STATUS_LABELS[s]}</p>
                <p className="text-xs text-slate-400">{entry ? formatDateTime(entry.at) : 'En attente'}</p>
              </div>
            </div>
            {i < STATUS_ORDER.length - 1 && (
              <div className={cx('my-2 h-6 w-0.5 self-start sm:my-5 sm:h-0.5 sm:w-full sm:flex-1 sm:self-center',
                i < currentIdx ? 'bg-brand-600' : 'bg-slate-100')}
                style={{ marginLeft: '1.35rem' }}
              ></div>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function ExternalTrackingCard() {
  const providers = ['Chronopost', 'Colissimo', 'DHL Express'];
  return (
    <Section title="Connecter un système de tracking externe" subtitle="Concept — synchronisez le statut avec le système du transporteur partenaire (bientôt disponible).">
      <div className="grid gap-3 sm:grid-cols-3">
        {providers.map(p => (
          <div key={p} className="flex flex-col items-center gap-2 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4 text-center">
            <span className="text-2xl">🔗</span>
            <p className="text-sm font-semibold text-slate-700">{p}</p>
            <button disabled title="Bientôt disponible" className="w-full cursor-not-allowed rounded-lg border border-slate-300 bg-white py-1.5 text-xs font-semibold text-slate-400">
              Connecter
            </button>
            <span className="rounded-full bg-slate-200 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-slate-500">Bientôt disponible</span>
          </div>
        ))}
      </div>
    </Section>

}

function TrackingPage({ params }) {
  const { bookings, getCarrier, advanceBookingStatus } = useApp();
  const { navigate } = useApp2();
  const booking = bookings.find(b => b.id === params.bookingId);

  if (!booking) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center">
        <p className="text-lg font-semibold text-slate-700">Livraison introuvable.</p>
        <SecondaryButton className="mt-4" onClick={() => navigate('dashboard')}>Retour au tableau de bord</SecondaryButton>
      </div>
    );
  }

  const carrier = getCarrier(booking.carrierId);
  const isDelivered = booking.status === 'delivered';

  return (
    <div className="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
      <button onClick={() => navigate('dashboard')} className="mb-4 text-sm font-semibold text-slate-500 hover:text-brand-700">← Retour au tableau de bord</button>

      <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-card sm:p-8">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Réf. {booking.ref}</p>
            <h1 className="mt-1 text-xl font-extrabold text-slate-900">{booking.pickup.city} → {booking.dropoff.city}</h1>
            <p className="mt-1 text-sm text-slate-500">Transporteur : <button onClick={() => navigate('carrier', { id: carrier.id })} className="font-semibold text-brand-700 hover:underline">{carrier.name}</button></p>
          </div>
          <StatusBadge status={booking.status} />
        </div>

        <div className="mt-8">
          <StatusStepper booking={booking} />
        </div>

        <div className="mt-8 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4">
          <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Outil de démonstration</p>
          <p className="mt-1 text-sm text-slate-600">Ce bouton simule la progression réelle de la livraison (dans un produit final, elle serait mise à jour automatiquement par le transporteur).</p>
          <SecondaryButton className="mt-3" onClick={() => advanceBookingStatus(booking.id)} disabled={isDelivered}>
            {isDelivered ? '✅ Livraison terminée' : '▶ Simuler : passer à l’étape suivante'}
          </SecondaryButton>
        </div>
      </div>

      <div className="mt-6 grid gap-6 sm:grid-cols-2">
        <Section title="🔐 Sécurité de la remise">
          <p className="text-sm text-slate-600">Communiquez ce code au transporteur uniquement au moment de la remise du colis, pour confirmer votre identité.</p>
          <div className="mt-3 flex items-center justify-center rounded-xl bg-brand-50 py-4">
            <span className="font-mono text-3xl font-extrabold tracking-widest text-brand-700">{booking.confirmationCode}</span>
          </div>
        </Section>

        <Section title="📷 Preuve de livraison">
          {isDelivered ? (
            <div className="flex h-32 flex-col items-center justify-center gap-1 rounded-xl bg-emerald-50 text-emerald-700">
              <span className="text-2xl">🖼️</span>
              <span className="text-sm font-semibold">Photo de dépôt disponible</span>
            </div>
          ) : (
            <div className="flex h-32 flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-slate-300 text-slate-400">
              <span className="text-2xl">📷</span>
              <span className="text-sm">Disponible une fois la livraison effectuée</span>
            </div>
          )}
        </Section>
      </div>

      <div className="mt-6">
        <ExternalTrackingCard />
      </div>

      <div className="mt-6 flex justify-center">
        <SecondaryButton onClick={() => navigate('messaging', { carrierId: carrier.id })}>💬 Contacter {carrier.name}</SecondaryButton>
      </div>
    </div>
  );
}

/* ======================================================================
   MESSAGING PAGE
   ====================================================================== */

function MessagingPage({ params }) {
  const { carriers, threads, sendMessage, simulateCarrierReply, typingCarrierId } = useApp();
  const { navigate } = useApp2();
  const [activeId, setActiveId] = useState(params.carrierId || null);
  const [text, setText] = useState('');
  const scrollRef = useRef(null);

  useEffect(() => {
    if (params.carrierId) setActiveId(params.carrierId);
  }, [params.carrierId]);

  useEffect(() => {
    if (!activeId) {
      const withMsgs = carriers.find(c => (threads[c.id] || []).length > 0);
      setActiveId(withMsgs ? withMsgs.id : carriers[0].id);
    }
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [activeId, threads, typingCarrierId]);

  const active = carriers.find(c => c.id === activeId);
  const conversations = carriers
    .map(c => ({ carrier: c, msgs: threads[c.id] || [] }))
    .sort((a, b) => {
      const at = a.msgs.length ? new Date(a.msgs[a.msgs.length - 1].time).getTime() : 0;
      const bt = b.msgs.length ? new Date(b.msgs[b.msgs.length - 1].time).getTime() : 0;
      return bt - at;
    });

  function handleSend() {
    if (!text.trim() || !active) return;
    sendMessage(active.id, text.trim(), 'client');
    setText('');
    simulateCarrierReply(active.id);
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }

  if (!active) return null;

  const activeMsgs = threads[active.id] || [];

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
      <h1 className="mb-6 text-2xl font-extrabold text-slate-900">Messagerie</h1>
      <div className="grid overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card lg:grid-cols-[300px_1fr]" style={{ minHeight: '560px' }}>
        <div className="border-b border-slate-200 lg:border-b-0 lg:border-r">
          <div className="max-h-[560px] overflow-y-auto msg-scroll">
            {conversations.map(({ carrier, msgs }) => {
              const last = msgs[msgs.length - 1];
              return (
                <button key={carrier.id} onClick={() => setActiveId(carrier.id)}
                  className={cx('flex w-full items-center gap-3 border-b border-slate-100 p-4 text-left transition hover:bg-slate-50',
                    activeId === carrier.id && 'bg-brand-50')}>
                  <Avatar name={carrier.name} initials={carrier.initials} size={10} />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-semibold text-slate-800">{carrier.name}</p>
                    <p className="truncate text-xs text-slate-500">{last ? last.text : 'Aucun message — dites bonjour !'}</p>
                  </div>
                  {last && <span className="shrink-0 text-[10px] text-slate-400">{formatDateTime(last.time).split(' à ')[0]}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div className="flex flex-col">
          <div className="flex items-center gap-3 border-b border-slate-200 p-4">
            <Avatar name={active.name} initials={active.initials} size={10} />
            <div className="min-w-0 flex-1">
              <p className="truncate text-sm font-bold text-slate-900">{active.name}</p>
              <p className="text-xs text-slate-500">{active.city} · répond en {active.responseTime}</p>
            </div>
            <button onClick={() => navigate('carrier', { id: active.id })} className="shrink-0 text-xs font-semibold text-brand-700 hover:underline">Voir le profil</button>
          </div>

          <div ref={scrollRef} className="msg-scroll flex-1 space-y-3 overflow-y-auto bg-slate-50 p-4" style={{ maxHeight: '420px' }}>
            {activeMsgs.length === 0 && (
              <p className="py-10 text-center text-sm text-slate-400">Aucun message pour l'instant. Envoyez le premier message à {active.name} !</p>
            )}
            {activeMsgs.map(m => (
              <div key={m.id} className={cx('flex', m.sender === 'client' ? 'justify-end' : 'justify-start')}>
                <div className={cx('max-w-[75%] rounded-2xl px-4 py-2.5 text-sm shadow-sm',
                  m.sender === 'client' ? 'rounded-br-sm bg-brand-600 text-white' : 'rounded-bl-sm bg-white text-slate-700')}>
                  <p>{m.text}</p>
                  <p className={cx('mt-1 text-[10px]', m.sender === 'client' ? 'text-brand-100' : 'text-slate-400')}>{formatDateTime(m.time)}</p>
                </div>
              </div>
            ))}
            {typingCarrierId === active.id && (
              <div className="flex justify-start">
                <div className="flex items-center gap-1 rounded-2xl rounded-bl-sm bg-white px-4 py-3 shadow-sm">
                  <span className="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400" style={{ animationDelay: '0ms' }}></span>
                  <span className="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400" style={{ animationDelay: '150ms' }}></span>
                  <span className="typing-dot h-1.5 w-1.5 rounded-full bg-slate-400" style={{ animationDelay: '300ms' }}></span>
                </div>
              </div>
            )}
          </div>

          <div className="flex items-end gap-2 border-t border-slate-200 p-3">
            <textarea rows="1" value={text} onChange={e => setText(e.target.value)} onKeyDown={handleKeyDown}
              placeholder="Écrivez votre message…" className={cx(inputClass, 'resize-none')}></textarea>
            <PrimaryButton onClick={handleSend} className="!px-4 !py-2.5" disabled={!text.trim()}>Envoyer</PrimaryButton>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   APP ROOT + NAV CONTEXT
   ====================================================================== */

const Nav2Context = createContext(null);
function useApp2() { return useContext(Nav2Context); }

function Screen({ nav }) {
  switch (nav.screen) {
    case 'home': return <HomePage />;
    case 'search': return <SearchPage params={nav.params} />;
    case 'carrier': return <CarrierDetailPage params={nav.params} />;
    case 'booking': return <BookingPage params={nav.params} />;
    case 'dashboard': return <DashboardPage />;
    case 'tracking': return <TrackingPage params={nav.params} />;
    case 'messaging': return <MessagingPage params={nav.params} />;
    default: return <HomePage />;
  }
}

function App() {
  const [nav, setNav] = useState(parseHash());

  useEffect(() => {
    function onHashChange() {
      setNav(parseHash());
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  function navigate(screen, params) {
    window.location.hash = buildHash(screen, params);
  }

  return (
    <Nav2Context.Provider value={{ nav, navigate }}>
      <AppProvider>
        <div className="flex min-h-screen flex-col">
          <NavBar />
          <main className="flex-1">
            <Screen nav={nav} />
          </main>
          <Footer />
        </div>
      </AppProvider>
    </Nav2Context.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
