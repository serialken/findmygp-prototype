/* ======================================================================
   UTILITIES
   ====================================================================== */

function cx(...parts) {
  return parts.filter(Boolean).join(' ');
}

function euros(amount) {
  const n = Number(amount) || 0;
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';
}

// Backend timestamps are naive UTC ISO strings (no trailing "Z"). Treat any
// ISO string without an explicit timezone designator as UTC before parsing,
// otherwise the browser interprets it as local time and every timestamp
// shown in the UI is off by the viewer's UTC offset.
function parseUTC(iso) {
  if (!iso) return null;
  const hasTZ = /[zZ]|[+-]\d\d:\d\d$/.test(iso);
  return new Date(hasTZ ? iso : iso + 'Z');
}

function formatDateTime(iso) {
  const d = parseUTC(iso);
  if (!d) return '';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' +
    d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function formatDateLong(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function dayLabelFromDate(dateStr) {
  const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return days[d.getDay()];
}

// The backend doesn't model customer reviews yet — these are deterministically
// generated per carrier (seeded from the carrier's real id) purely for visual
// filler on the profile page. Ratings/review counts themselves ARE real API data.
const REVIEW_AUTHORS = ['Marie D.', 'Nicolas T.', 'Claire B.', 'Antoine R.', 'Léa M.', 'Pierre G.', 'Emma S.', 'Hugo L.', 'Chloé F.', 'Maxime P.', 'Julie N.', 'Romain C.'];

const REVIEW_COMMENTS = [
  { text: "Livraison rapide et transporteur très professionnel, je recommande !", rating: 5 },
  { text: "Colis arrivé en parfait état, communication au top pendant tout le trajet.", rating: 5 },
  { text: "Ponctuel et sérieux, exactement ce qu'il fallait pour un envoi urgent.", rating: 5 },
  { text: "Très bon contact, prix correct pour la prestation fournie.", rating: 4 },
  { text: "Petit retard à la prise en charge mais livraison finale impeccable.", rating: 4 },
  { text: "Excellent suivi, j'ai reçu des nouvelles à chaque étape du trajet.", rating: 5 },
  { text: "Manutention soignée pour un colis fragile, rien à redire.", rating: 5 },
  { text: "Réactif dès le premier message, je referai appel à ce transporteur.", rating: 4 },
  { text: "Bon rapport qualité-prix, à recommander pour des trajets réguliers.", rating: 4 },
  { text: "Service fiable, le colis est arrivé plus tôt que prévu !", rating: 5 },
];

const REVIEW_DATES = ['il y a 3 jours', 'il y a 1 semaine', 'il y a 2 semaines', 'il y a 3 semaines', 'il y a 1 mois', 'il y a 2 mois'];

function buildReviews(seed, count) {
  const reviews = [];
  for (let i = 0; i < count; i++) {
    const authorIdx = (seed * 3 + i * 5) % REVIEW_AUTHORS.length;
    const commentIdx = (seed * 2 + i * 7) % REVIEW_COMMENTS.length;
    const dateIdx = (seed + i * 3) % REVIEW_DATES.length;
    const c = REVIEW_COMMENTS[commentIdx];
    reviews.push({
      id: `r${seed}-${i}`,
      author: REVIEW_AUTHORS[authorIdx],
      rating: c.rating,
      text: c.text,
      date: REVIEW_DATES[dateIdx],
    });
  }
  return reviews;
}

const STATUS_ORDER = ['pending', 'confirmed', 'picked_up', 'in_transit', 'delivered'];
const STATUS_LABELS = { pending: 'En attente', confirmed: 'Confirmé', picked_up: 'Récupéré', in_transit: 'En transit', delivered: 'Livré', cancelled: 'Annulé' };
const STATUS_ICONS = { pending: '🗓️', confirmed: '✅', picked_up: '📤', in_transit: '🚚', delivered: '📬', cancelled: '✕' };

/* ======================================================================
   HASH ROUTER (no router library — plain window.location.hash)
   ====================================================================== */

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const [screen, qs] = raw.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  return { screen: screen || 'home', params };
}

function buildHash(screen, params) {
  const cleaned = Object.fromEntries(Object.entries(params || {}).filter(([, v]) => v !== undefined && v !== null && v !== ''));
  const qs = new URLSearchParams(cleaned).toString();
  return `#/${screen}${qs ? '?' + qs : ''}`;
}

/* ======================================================================
   API CLIENT
   ====================================================================== */

// Backend API base URL. Matches the backend's default uvicorn port (see
// backend/README.md). Change this when deploying, or if you run the API on
// a different port locally — everything else in this file reads from this constant.
const API_BASE = 'https://findmygp-prototype-production.up.railway.app';
const WS_BASE = API_BASE.replace(/^http/, 'ws');

class ApiError extends Error {
  constructor(message, status, body) {
    super(message);
    this.status = status;
    this.body = body;
  }
}

async function apiFetch(path, { method = 'GET', body, token } = {}) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;

  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    throw new ApiError("Impossible de contacter le serveur LogiConnect. Vérifiez qu'il est démarré et réessayez.", 0, null);
  }

  const text = await res.text();
  let data = null;
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = null; }
  }

  if (!res.ok) {
    const message = (data && typeof data.detail === 'string') ? data.detail : `Erreur ${res.status}`;
    throw new ApiError(message, res.status, data);
  }
  return data;
}

function hashSeed(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return (hash % 997) + 1;
}

// Normalizes the API's snake_case carrier payload into the camelCase shape
// the UI components use, and attaches presentational-only fields (initials,
// cosmetic reviews) that have no backend equivalent.
function normalizeCarrier(c) {
  const initials = c.name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return {
    ...c,
    packageTypes: c.package_types,
    zonesServed: c.zones_served,
    basePrice: c.base_price,
    pricePerKm: c.price_per_km,
    availableDays: c.available_days,
    timeWindows: c.time_windows,
    responseTime: c.response_time,
    completedDeliveries: c.completed_deliveries,
    yearsActive: c.years_active,
    reviewCountDisplay: c.review_count,
    deliveryEstimate: c.delivery_estimate,
    initials,
    reviews: buildReviews(hashSeed(c.id), 3),
  };
}

function normalizeBooking(b) {
  return {
    ...b,
    carrierId: b.carrier_id,
    pickup: { address: b.pickup_address, city: b.pickup_city, postalCode: b.pickup_postal_code || '' },
    dropoff: { address: b.dropoff_address, city: b.dropoff_city, postalCode: b.dropoff_postal_code || '' },
    packageType: b.package_type,
    weight: b.weight_kg,
    date: b.requested_date,
    timeWindow: b.time_window,
    distanceKm: b.distance_km,
    confirmationCode: b.confirmation_code,
    createdAt: b.created_at,
    paymentStatus: b.payment_status,
    externalTrackingNumber: b.external_tracking_number,
  };
}

/* ======================================================================
   AUTH
   ====================================================================== */

const AuthContext = createContext(null);
function useAuth() { return useContext(AuthContext); }

function AuthProvider({ children }) {
  const [token, setToken] = useState(() => localStorage.getItem('lc_access_token'));
  const [refreshToken, setRefreshToken] = useState(() => localStorage.getItem('lc_refresh_token'));
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    if (!token) { setAuthLoading(false); return; }
    apiFetch('/auth/me', { token })
      .then(u => { if (!cancelled) setUser(u); })
      .catch(() => { if (!cancelled) clearAuth(); })
      .finally(() => { if (!cancelled) setAuthLoading(false); });
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, []);

  function persist(data) {
    setToken(data.access_token);
    setRefreshToken(data.refresh_token);
    setUser(data.user);
    localStorage.setItem('lc_access_token', data.access_token);
    localStorage.setItem('lc_refresh_token', data.refresh_token);
  }

  function clearAuth() {
    setToken(null);
    setRefreshToken(null);
    setUser(null);
    localStorage.removeItem('lc_access_token');
    localStorage.removeItem('lc_refresh_token');
  }

  async function login(email, password) {
    const data = await apiFetch('/auth/login', { method: 'POST', body: { email, password } });
    persist(data);
    return data;
  }

  async function register(email, password, fullName) {
    const data = await apiFetch('/auth/register', { method: 'POST', body: { email, password, full_name: fullName, role: 'client' } });
    persist(data);
    return data;
  }

  function logout() {
    clearAuth();
  }

  // Wraps apiFetch with the current token, and transparently retries once
  // via /auth/refresh on a 401 (access tokens expire after 30 min — this is
  // the difference between "session dies annoyingly mid-use" and not).
  async function authedFetch(path, opts = {}) {
    try {
      return await apiFetch(path, { ...opts, token });
    } catch (err) {
      if (err.status === 401 && refreshToken) {
        try {
          const data = await apiFetch('/auth/refresh', { method: 'POST', body: { refresh_token: refreshToken } });
          persist(data);
          return await apiFetch(path, { ...opts, token: data.access_token });
        } catch (refreshErr) {
          clearAuth();
          throw err;
        }
      }
      if (err.status === 401) clearAuth();
      throw err;
    }
  }

  const value = {
    token, user, authLoading, isAuthenticated: !!token,
    login, register, logout, authedFetch,
  };

  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}

/* ======================================================================
   SHARED DATA (all carriers, fetched once — used for the city autocomplete
   list, the homepage's top-rated section, and as a lookup cache elsewhere
   so pages don't have to refetch a carrier they already know the id of)
   ====================================================================== */

const DataContext = createContext(null);
function useData() { return useContext(DataContext); }

function DataProvider({ children }) {
  const [allCarriers, setAllCarriers] = useState([]);
  const [carriersLoading, setCarriersLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    apiFetch('/carriers')
      .then(list => { if (!cancelled) setAllCarriers(list.map(normalizeCarrier)); })
      .catch(() => {})
      .finally(() => { if (!cancelled) setCarriersLoading(false); });
    return () => { cancelled = true; };
  }, []);

  const cityList = useMemo(
    () => Array.from(new Set(allCarriers.flatMap(c => [c.city, ...c.zonesServed]))).sort(),
    [allCarriers]
  );

  function getCarrierFromCache(id) {
    return allCarriers.find(c => c.id === id) || null;
  }

  const value = { allCarriers, cityList, carriersLoading, getCarrierFromCache };
  return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
}

// pickup/dropoff city, vehicle and max price are sent to the API as query
// params (server-side filtering). packageTypes (multi-select), date/day-of-
// week availability, and timeWindow aren't modeled as query params on the
// backend, so they're refined here client-side over the already-narrowed result set.
function applyClientSideFilters(carriers, filters) {
  return carriers.filter(c => {
    if (filters.packageTypes.length > 0) {
      const ok = filters.packageTypes.some(pt => c.packageTypes.includes(pt));
      if (!ok) return false;
    }
    if (filters.date) {
      const day = dayLabelFromDate(filters.date);
      if (day && !c.availableDays.includes(day)) return false;
    }
    if (filters.timeWindow !== 'all' && !c.timeWindows.includes(filters.timeWindow)) return false;
    return true;
  });
}

function SearchPage({ params }) {
  const [filters, setFilters] = useState({
    pickupCity: params.pickupCity || '',
    dropoffCity: params.dropoffCity || '',
    date: params.date || '',
    timeWindow: 'all',
    packageTypes: [],
    vehicle: 'all',
    maxPrice: 70,
  });
  const [sort, setSort] = useState('rating_desc');
  const [showFilters, setShowFilters] = useState(false);
  const [serverResults, setServerResults] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');

  useEffect(() => {
    let cancelled = false;
    const timer = setTimeout(() => {
      setLoading(true);
      setError('');
      const qs = new URLSearchParams();
      if (filters.pickupCity) qs.set('pickup_city', filters.pickupCity);
      if (filters.dropoffCity) qs.set('dropoff_city', filters.dropoffCity);
      if (filters.vehicle !== 'all') qs.set('vehicle', filters.vehicle);
      qs.set('max_price', String(filters.maxPrice));
      apiFetch(`/carriers?${qs.toString()}`)
        .then(list => { if (!cancelled) setServerResults(list.map(normalizeCarrier)); })
        .catch(err => { if (!cancelled) setError(err.message); })
        .finally(() => { if (!cancelled) setLoading(false); });
    }, 300);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [filters.pickupCity, filters.dropoffCity, filters.vehicle, filters.maxPrice]);

  const results = useMemo(() => {
    const list = applyClientSideFilters(serverResults, filters);
    const sorted = [...list];
    if (sort === 'rating_desc') sorted.sort((a, b) => b.rating - a.rating);
    if (sort === 'price_asc') sorted.sort((a, b) => a.basePrice - b.basePrice);
    if (sort === 'price_desc') sorted.sort((a, b) => b.basePrice - a.basePrice);
    return sorted;
    // eslint-disable-next-line
  }, [serverResults, filters.packageTypes, filters.date, filters.timeWindow, sort]);

  return (
    <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div className="mb-6">
        <h1 className="text-2xl font-extrabold text-slate-900">Transporteurs disponibles</h1>
        <p className="mt-1 text-sm text-slate-500">
          {filters.pickupCity || filters.dropoffCity
            ? <>Trajet : <strong>{filters.pickupCity || 'Toute ville'}</strong> → <strong>{filters.dropoffCity || 'Toute ville'}</strong></>
            : "Parcourez l'ensemble des transporteurs partenaires."}
        </p>
      </div>

      <button onClick={() => setShowFilters(s => !s)} className="mb-4 inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 lg:hidden">
        🎛️ Filtres {showFilters ? '▲' : '▼'}
      </button>

      <div className="grid gap-8 lg:grid-cols-[280px_1fr]">
        <aside className={cx(showFilters ? 'block' : 'hidden', 'lg:block')}>
          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-card lg:sticky lg:top-20">
            <FilterPanel filters={filters} setFilters={setFilters} />
          </div>
        </aside>

        <div>
          <div className="mb-4 flex items-center justify-between">
            <p className="text-sm text-slate-500">{loading ? 'Recherche…' : `${results.length} transporteur${results.length !== 1 ? 's' : ''} trouvé${results.length !== 1 ? 's' : ''}`}</p>
            <select className={cx(inputClass, 'w-auto')} value={sort} onChange={e => setSort(e.target.value)}>
              <option value="rating_desc">Mieux notés</option>
              <option value="price_asc">Prix croissant</option>
              <option value="price_desc">Prix décroissant</option>
            </select>
          </div>

          <ErrorBanner message={error} />

          {loading ? <Spinner label="Recherche des transporteurs…" /> : results.length === 0 ? (
            <div className="rounded-2xl border border-dashed border-slate-300 bg-white p-12 text-center">
              <div className="text-4xl">🔍</div>
              <h3 className="mt-3 text-base font-bold text-slate-800">Aucun transporteur ne correspond à vos critères</h3>
              <p className="mt-1 text-sm text-slate-500">Essayez d'élargir votre recherche ou de réinitialiser les filtres.</p>
            </div>
          ) : (
            <div className="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
              {results.map(c => <CarrierCard key={c.id} carrier={c} />)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   AUTH GUARD
   ====================================================================== */

function useRequireAuth(nextScreen, nextParams) {
  const { isAuthenticated, authLoading } = useAuth();
  const { navigate } = useApp2();
  useEffect(() => {
    if (!authLoading && !isAuthenticated) {
      navigate('login', { next: nextScreen, ...nextParams });
    }
    // eslint-disable-next-line
  }, [authLoading, isAuthenticated]);
  return { isAuthenticated, authLoading };
}

/* ======================================================================
   LOGIN / REGISTER PAGE
   ====================================================================== */

function LoginPage({ params }) {
  const { login, register, isAuthenticated } = useAuth();
  const { navigate } = useApp2();
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [fullName, setFullName] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (isAuthenticated) {
      const { next, ...rest } = params || {};
      navigate(next || 'dashboard', rest);
    }
    // eslint-disable-next-line
  }, [isAuthenticated]);

  async function submit(e) {
    e.preventDefault();
    setError('');
    setLoading(true);
    try {
      if (mode === 'login') {
        await login(email, password);
      } else {
        await register(email, password, fullName);
      }
      // Redirect happens via the effect above once isAuthenticated flips true.
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-14 sm:px-6">
      <div className="rounded-2xl border border-slate-200 bg-white p-8 shadow-card">
        <div className="mb-6 flex rounded-xl bg-slate-100 p-1">
          <button onClick={() => setMode('login')} className={cx('flex-1 rounded-lg py-2 text-sm font-semibold transition', mode === 'login' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500')}>Connexion</button>
          <button onClick={() => setMode('register')} className={cx('flex-1 rounded-lg py-2 text-sm font-semibold transition', mode === 'register' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500')}>Créer un compte</button>
        </div>

        <h1 className="text-xl font-extrabold text-slate-900">{mode === 'login' ? 'Connectez-vous' : 'Créez votre compte'}</h1>
        <p className="mt-1 text-sm text-slate-500">{mode === 'login' ? 'Accédez à vos réservations et à la messagerie.' : "Réservez vos livraisons et suivez-les en temps réel."}</p>

        <form onSubmit={submit} className="mt-6 space-y-4">
          {mode === 'register' && (
            <Field label="Nom complet">
              <input required className={inputClass} value={fullName} onChange={e => setFullName(e.target.value)} placeholder="Ex : Awa Diallo" />
            </Field>
          )}
          <Field label="Email">
            <input required type="email" className={inputClass} value={email} onChange={e => setEmail(e.target.value)} placeholder="vous@exemple.com" />
          </Field>
          <Field label="Mot de passe" hint={mode === 'register' ? '8 caractères minimum' : undefined}>
            <input required type="password" minLength={mode === 'register' ? 8 : undefined} className={inputClass} value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
          </Field>

          <ErrorBanner message={error} />

          <PrimaryButton type="submit" className="w-full" disabled={loading}>
            {loading ? 'Un instant…' : mode === 'login' ? 'Se connecter' : 'Créer mon compte'}
          </PrimaryButton>
        </form>
      </div>
    </div>
  );
}

/* ======================================================================
   BOOKING FLOW (multi-step)
   ====================================================================== */

const BOOKING_STEPS = ['Adresses', 'Colis', 'Date & heure', 'Récapitulatif'];

function StepIndicator({ step }) {
  return (
    <div className="mb-8 flex items-center">
      {BOOKING_STEPS.map((label, i) => {
        const idx = i + 1;
        const done = idx < step;
        const current = idx === step;
        return (
          <React.Fragment key={label}>
            <div className="flex flex-col items-center">
              <div className={cx('flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold transition',
                done ? 'bg-brand-600 text-white' : current ? 'bg-brand-600 text-white ring-4 ring-brand-100' : 'bg-slate-100 text-slate-400')}>
                {done ? '✓' : idx}
              </div>
              <span className={cx('mt-1.5 hidden text-xs font-semibold sm:block', current || done ? 'text-slate-700' : 'text-slate-400')}>{label}</span>
            </div>
            {idx < BOOKING_STEPS.length && <div className={cx('mx-2 h-0.5 flex-1', done ? 'bg-brand-600' : 'bg-slate-100')}></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function AddressFields({ title, value, onChange, international }) {
  const postalLabel = international ? 'Code postal / repère' : 'Code postal';
  const postalPlaceholder = international ? 'Ex : 75011 ou quartier, BP' : 'Ex : 75011';
  return (
    <div>
      <h3 className="mb-3 text-sm font-bold text-slate-900">{title}</h3>
      <div className="grid gap-3 sm:grid-cols-2">
        <div className="sm:col-span-2">
          <Field label="Adresse">
            <input className={inputClass} placeholder="Numéro et nom de rue" value={value.address}
              onChange={e => onChange({ ...value, address: e.target.value })} />
          </Field>
        </div>
        <Field label="Ville">
          <input list="city-list" className={inputClass} placeholder="Ville" value={value.city}
            onChange={e => onChange({ ...value, city: e.target.value })} />
        </Field>
        <Field label={postalLabel} hint="Optionnel">
          <input className={inputClass} placeholder={postalPlaceholder} value={value.postalCode}
            onChange={e => onChange({ ...value, postalCode: e.target.value })} />
        </Field>
      </div>
    </div>
  );
}

function BookingPage({ params }) {
  const { navigate } = useApp2();
  const { isAuthenticated, authLoading } = useRequireAuth('booking', { carrierId: params.carrierId });
  const { authedFetch } = useAuth();
  const { getCarrierFromCache } = useData();

  const [carrier, setCarrier] = useState(() => getCarrierFromCache(params.carrierId));
  const [carrierLoading, setCarrierLoading] = useState(!carrier);

  useEffect(() => {
    if (carrier) { setCarrierLoading(false); return; }
    let cancelled = false;
    apiFetch(`/carriers/${params.carrierId}`)
      .then(c => { if (!cancelled) setCarrier(normalizeCarrier(c)); })
      .catch(() => {})
      .finally(() => { if (!cancelled) setCarrierLoading(false); });
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [params.carrierId]);

  const [step, setStep] = useState(1);
  const [createdBooking, setCreatedBooking] = useState(null);
  const [form, setForm] = useState({
    pickup: { address: '', city: '', postalCode: '' },
    dropoff: { address: '', city: '', postalCode: '' },
    packageType: 'petit_colis',
    weight: '',
    dimensions: '',
    fragile: false,
    description: '',
    date: todayISO(),
    timeWindow: 'Matin',
    acceptTerms: false,
  });

  useEffect(() => {
    if (carrier && !form.pickup.city) {
      setForm(f => ({ ...f, pickup: { ...f.pickup, city: carrier.city } }));
    }
    // eslint-disable-next-line
  }, [carrier]);

  const [quote, setQuote] = useState(null);
  const [quoteLoading, setQuoteLoading] = useState(false);
  const [quoteError, setQuoteError] = useState('');

  useEffect(() => {
    if (step !== 4 || !carrier) return;
    let cancelled = false;
    setQuoteLoading(true);
    setQuoteError('');
    apiFetch('/bookings/quote', {
      method: 'POST',
      body: {
        pickup_city: form.pickup.city,
        dropoff_city: form.dropoff.city,
        pickup_address: form.pickup.address,
        dropoff_address: form.dropoff.address,
        vehicle: carrier.vehicle,
        carrier_id: carrier.id,
        fragile: form.fragile,
      },
    })
      .then(q => { if (!cancelled) setQuote(q); })
      .catch(err => { if (!cancelled) setQuoteError(err.message); })
      .finally(() => { if (!cancelled) setQuoteLoading(false); });
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [step, carrier, form.pickup.city, form.dropoff.city, form.pickup.address, form.dropoff.address, form.fragile]);

  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState('');

  if (authLoading || !isAuthenticated) return <Spinner label="Vérification de la connexion…" />;
  if (carrierLoading) return <Spinner label="Chargement du transporteur…" />;

  if (!carrier) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center">
        <p className="text-lg font-semibold text-slate-700">Transporteur introuvable.</p>
        <SecondaryButton className="mt-4" onClick={() => navigate('search')}>Retour à la recherche</SecondaryButton>
      </div>
    );
  }

  const isInternational = carrier.vehicle === 'avion' || carrier.vehicle === 'bateau';

  function isStepValid(s) {
    if (s === 1) return form.pickup.address && form.pickup.city && form.dropoff.address && form.dropoff.city;
    if (s === 2) return form.packageType && form.weight;
    if (s === 3) return form.date && form.timeWindow;
    return true;
  }

  async function confirmBooking() {
    setSubmitting(true);
    setSubmitError('');
    try {
      const booking = await authedFetch('/bookings', {
        method: 'POST',
        body: {
          carrier_id: carrier.id,
          pickup_address: form.pickup.address,
          pickup_city: form.pickup.city,
          pickup_postal_code: form.pickup.postalCode || null,
          dropoff_address: form.dropoff.address,
          dropoff_city: form.dropoff.city,
          dropoff_postal_code: form.dropoff.postalCode || null,
          package_type: form.packageType,
          weight_kg: Number(form.weight),
          dimensions: form.dimensions || null,
          description: form.description || null,
          fragile: form.fragile,
          requested_date: form.date,
          time_window: form.timeWindow,
        },
      });
      setCreatedBooking(normalizeBooking(booking));
      setStep(5);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      setSubmitError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  if (step === 5 && createdBooking) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-14 sm:px-6">
        <div className="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-card animate-fade-in-up">
          <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-3xl">✅</div>
          <h1 className="mt-4 text-2xl font-extrabold text-slate-900">Réservation confirmée !</h1>
          <p className="mt-1 text-sm text-slate-500">Votre demande a bien été envoyée à {carrier.name}.</p>

          <div className="mt-6 rounded-xl bg-slate-50 p-5 text-left">
            <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Référence de réservation</p>
            <p className="mt-1 font-mono text-xl font-extrabold text-brand-700">{createdBooking.ref}</p>
            <div className="mt-4 grid gap-2 text-sm text-slate-600 sm:grid-cols-2">
              <p><strong className="text-slate-800">Trajet :</strong> {createdBooking.pickup.city} → {createdBooking.dropoff.city}</p>
              <p><strong className="text-slate-800">Date :</strong> {formatDateLong(createdBooking.date)}</p>
              <p><strong className="text-slate-800">Créneau :</strong> {createdBooking.timeWindow}</p>
              <p><strong className="text-slate-800">Prix :</strong> {euros(createdBooking.price)}</p>
              {carrier.deliveryEstimate && <p className="sm:col-span-2"><strong className="text-slate-800">Délai de livraison estimé :</strong> {carrier.deliveryEstimate}</p>}
            </div>
          </div>

          <div className="mt-6 flex flex-col gap-2.5">
            <PrimaryButton onClick={() => navigate('tracking', { bookingId: createdBooking.id })}>📍 Voir le suivi & payer</PrimaryButton>
            <SecondaryButton onClick={() => navigate('messaging', { carrierId: carrier.id })}>💬 Envoyer un message au transporteur</SecondaryButton>
            <button onClick={() => navigate('dashboard')} className="mt-1 text-sm font-semibold text-slate-500 hover:text-brand-700">Aller à mon tableau de bord →</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8">
      <button onClick={() => navigate('carrier', { id: carrier.id })} className="mb-4 text-sm font-semibold text-slate-500 hover:text-brand-700">← Retour au profil</button>

      <div className="mb-6 flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-card">
        <Avatar name={carrier.name} initials={carrier.initials} size={10} />
        <div>
          <p className="text-sm font-bold text-slate-900">Demande de livraison — {carrier.name}</p>
          <p className="text-xs text-slate-500">{carrier.city} · {VEHICLES[carrier.vehicle].label}</p>
        </div>
      </div>

      <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-card sm:p-8">
        <StepIndicator step={step} />

        {step === 1 && (
          <div className="space-y-6">
            <AddressFields title="📍 Adresse de départ" value={form.pickup} onChange={v => setForm(f => ({ ...f, pickup: v }))} international={isInternational} />
            <AddressFields title="🏁 Adresse d'arrivée" value={form.dropoff} onChange={v => setForm(f => ({ ...f, dropoff: v }))} international={isInternational} />
          </div>
        )}

        {step === 2 && (
          <div className="space-y-4">
            <Field label="Type de colis">
              <div className="flex flex-wrap gap-2">
                {Object.entries(PACKAGE_TYPES).map(([key, t]) => (
                  <button key={key} type="button" onClick={() => setForm(f => ({ ...f, packageType: key }))}
                    className={cx('inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition',
                      form.packageType === key ? 'border-brand-600 bg-brand-600 text-white' : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50')}>
                    <span>{t.icon}</span>{t.label}
                  </button>
                ))}
              </div>
            </Field>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Poids approximatif (kg)">
                <input type="number" min="0" step="0.5" className={inputClass} placeholder="Ex : 3" value={form.weight}
                  onChange={e => setForm(f => ({ ...f, weight: e.target.value }))} />
              </Field>
              <Field label="Dimensions (L x l x H cm)" hint="Optionnel">
                <input className={inputClass} placeholder="Ex : 40 x 30 x 20" value={form.dimensions}
                  onChange={e => setForm(f => ({ ...f, dimensions: e.target.value }))} />

            </div>
            <Field label="Description du colis" hint="Optionnel — aide le transporteur à s'organiser">

            <label className="flex items-center gap-2.5 rounded-xl border border-slate-200 bg-slate-50 p-3.5">

            {carrier.deliveryEstimate && (
              <p className="rounded-xl bg-brand-50 p-3 text-sm text-brand-800">

              </Field>
              <Field label={isInternational ? 'Créneau de dépôt' : 'Créneau horaire'}>

                      <tr><td className="py-1 text-slate-500">Distance ({quote.distance_km} km)</td><td className="py-1 text-right text-slate-700">{euros(quote.distance_price)}</td></tr>
                      {form.fragile && <tr><td className="py-1 text-slate-500">Supplément fragile</td><td className="py-1 text-right text-slate-700">{euros(quote.fragile_surcharge)}</td></tr>}
                      <tr className="border-t border-slate-200"><td className="pt-2 font-bold text-slate-900">Total estimé</td><td className="pt-2 text-right text-lg font-extrabold text-brand-700">{euros(quote.total_price)}</td></tr>
                    </tbody>
                  </table>
                ) : null}
              </div>
            </div>

            <ErrorBanner message={submitError} />

            <label className="flex items-start gap-2.5">
              <input type="checkbox" checked={form.acceptTerms} onChange={e => setForm(f => ({ ...f, acceptTerms: e.target.checked }))}
                className="mt-0.5 h-4 w-4 rounded accent-brand-600" />
              <span className="text-sm text-slate-600">J'accepte les conditions générales d'utilisation et confirme l'exactitude des informations fournies pour cette demande de livraison.</span>
            </label>
          </div>
        )}

        <div className="mt-8 flex items-center justify-between border-t border-slate-100 pt-6">
          <SecondaryButton onClick={() => setStep(s => Math.max(1, s - 1))} disabled={step === 1}>← Précédent</SecondaryButton>
          {step < 4 ? (
            <PrimaryButton onClick={() => setStep(s => s + 1)} disabled={!isStepValid(step)}>Continuer →</PrimaryButton>
          ) : (
            <PrimaryButton onClick={confirmBooking} disabled={!form.acceptTerms || submitting}>{submitting ? 'Envoi en cours…' : '✅ Confirmer la demande'}</PrimaryButton>
          )}
        </div>
      </div>
    </div>
  );
}

function PaymentPanel({ booking, onPaid }) {
  const { authedFetch } = useAuth();
  const [clientSecret, setClientSecret] = useState(null);
  const [publishableKey, setPublishableKey] = useState(null);
  const [error, setError] = useState('');
  const [loadingIntent, setLoadingIntent] = useState(false);
  const [paying, setPaying] = useState(false);
  const [succeeded, setSucceeded] = useState(booking.paymentStatus === 'paid');
  const stripeRef = useRef(null);
  const cardElRef = useRef(null);
  const cardMountRef = useRef(null);

  useEffect(() => { setSucceeded(booking.paymentStatus === 'paid'); }, [booking.paymentStatus]);

  async function startPayment() {
    setLoadingIntent(true);
    setError('');
    try {
      const data = await authedFetch(`/payments/bookings/${booking.id}/intent`, { method: 'POST' });
      setClientSecret(data.client_secret);
      setPublishableKey(data.publishable_key);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoadingIntent(false);
    }
  }

  useEffect(() => {
    if (!clientSecret || !publishableKey || !window.Stripe || !cardMountRef.current) return;
    const stripe = window.Stripe(publishableKey);
    const elements = stripe.elements();
    const card = elements.create('card', { style: { base: { fontSize: '14px' } } });
    card.mount(cardMountRef.current);
    stripeRef.current = stripe;
    cardElRef.current = card;
    return () => card.destroy();
  }, [clientSecret, publishableKey]);

  async function confirmPayment(e) {
    e.preventDefault();
    if (!stripeRef.current || !cardElRef.current) return;
    setPaying(true);
    setError('');
    const result = await stripeRef.current.confirmCardPayment(clientSecret, {
      payment_method: { card: cardElRef.current },
    });
    setPaying(false);
    if (result.error) {
      setError(result.error.message);
    } else if (result.paymentIntent && result.paymentIntent.status === 'succeeded') {
      setSucceeded(true);
      if (onPaid) onPaid();
      // Stripe's webhook is what normally flips the booking to "paid" server-side,
      // but it can't reach a local/dev API — so also confirm synchronously here.
      // The endpoint re-verifies with Stripe itself, it doesn't just trust this call.
      authedFetch(`/payments/bookings/${booking.id}/confirm`, { method: 'POST' }).catch(() => {});
    }
  }

  if (succeeded) {
    return (
      <div className="flex items-center gap-2 rounded-xl bg-emerald-50 p-4 text-sm font-semibold text-emerald-700">
        ✅ Paiement confirmé pour cette livraison.
      </div>
    );
  }

  return (
    <div>
      {!clientSecret ? (
        <div>
          <PrimaryButton onClick={startPayment} disabled={loadingIntent}>
            {loadingIntent ? 'Préparation du paiement…' : `💳 Payer ${euros(booking.price)}`}
          </PrimaryButton>
          {error && <p className="mt-2 text-sm text-rose-600">{error}</p>}
          {!window.Stripe && <p className="mt-2 text-xs text-slate-400">Stripe.js n'a pas pu se charger (bloqueur de script ou hors ligne).</p>}
        </div>
      ) : (
        <form onSubmit={confirmPayment} className="space-y-3">
          <div ref={cardMountRef} className="rounded-xl border border-slate-300 bg-white p-3.5"></div>
          <p className="text-xs text-slate-400">Mode test Stripe — carte 4242 4242 4242 4242, date future, CVC quelconque.</p>
          {error && <p className="text-sm text-rose-600">{error}</p>}
          <PrimaryButton type="submit" disabled={paying} className="w-full">{paying ? 'Paiement en cours…' : `Confirmer le paiement de ${euros(booking.price)}`}</PrimaryButton>
        </form>
      )}
    </div>
  );
}

function TrackingPage({ params }) {
  const { isAuthenticated, authLoading } = useRequireAuth('tracking', { bookingId: params.bookingId });
  const { authedFetch, token } = useAuth();
  const { navigate } = useApp2();
  const [booking, setBooking] = useState(null);
  const [carrier, setCarrier] = useState(null);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [syncing, setSyncing] = useState(false);

  useEffect(() => {
    if (authLoading || !isAuthenticated) return;
    let cancelled = false;
    setLoading(true);
    setError('');
    (async () => {
      try {
        const b = await authedFetch(`/bookings/${params.bookingId}`);
        if (cancelled) return;
        const nb = normalizeBooking(b);
        setBooking(nb);
        const [c, evs] = await Promise.all([
          apiFetch(`/carriers/${nb.carrierId}`),
          authedFetch(`/tracking/${params.bookingId}`),
        ]);
        if (cancelled) return;
        setCarrier(normalizeCarrier(c));
        setEvents(evs);
      } catch (err) {
        if (!cancelled) setError(err.message);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [params.bookingId, authLoading, isAuthenticated]);

  useEffect(() => {
    if (!token || !isAuthenticated || authLoading) return;
    const ws = new WebSocket(`${WS_BASE}/ws/tracking/${params.bookingId}?token=${encodeURIComponent(token)}`);
    ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        if (data.type === 'tracking_update') {
          setEvents(prev => [...prev, { id: 'ws-' + data.created_at, status: data.status, note: data.note, created_at: data.created_at, source: 'internal' }]);
          setBooking(prev => (prev ? { ...prev, status: data.status } : prev));
        }
      } catch (e) { /* ignore malformed frames */ }
    };
    return () => ws.close();
  }, [token, params.bookingId, isAuthenticated, authLoading]);

  async function handleSync() {
    setSyncing(true);
    try {
      const evs = await authedFetch(`/tracking/${params.bookingId}/sync`, { method: 'POST' });
      setEvents(evs);
      if (evs.length) setBooking(prev => (prev ? { ...prev, status: evs[evs.length - 1].status } : prev));
    } catch (err) {
      setError(err.message);
    } finally {
      setSyncing(false);
    }
  }

  if (authLoading || !isAuthenticated || loading) return <Spinner label="Chargement du suivi…" />;

  if (!booking || !carrier) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center">
        <p className="text-lg font-semibold text-slate-700">{error || 'Livraison introuvable.'}</p>
        <SecondaryButton className="mt-4" onClick={() => navigate('dashboard')}>Retour au tableau de bord</SecondaryButton>
      </div>
    );
  }

  const isDelivered = booking.status === 'delivered';

  return (
    <div className="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
      <button onClick={() => navigate('dashboard')} className="mb-4 text-sm font-semibold text-slate-500 hover:text-brand-700">← Retour au tableau de bord</button>

      <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-card sm:p-8">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Réf. {booking.ref}</p>
            <h1 className="mt-1 text-xl font-extrabold text-slate-900">{booking.pickup.city} → {booking.dropoff.city}</h1>
            <p className="mt-1 text-sm text-slate-500">Transporteur : <button onClick={() => navigate('carrier', { id: carrier.id })} className="font-semibold text-brand-700 hover:underline">{carrier.name}</button></p>
          </div>
          <StatusBadge status={booking.status} />
        </div>

        <div className="mt-8">
          <StatusStepper status={booking.status} events={events} />
        </div>

        <div className="mt-8 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4">
          <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Suivi transporteur</p>
          <p className="mt-1 text-sm text-slate-600">Interroge le réseau du transporteur (simulation accélérée tant qu'aucune clé Chronopost/Colissimo/DHL réelle n'est configurée côté serveur) pour récupérer les derniers événements.</p>
          <SecondaryButton className="mt-3" onClick={handleSync} disabled={isDelivered || syncing}>
            {isDelivered ? '✅ Livraison terminée' : syncing ? 'Vérification…' : '🔄 Vérifier les mises à jour'}
          </SecondaryButton>
        </div>
      </div>

      <div className="mt-6 grid gap-6 sm:grid-cols-2">
        <Section title="🔐 Sécurité de la remise">
          <p className="text-sm text-slate-600">Communiquez ce code au transporteur uniquement au moment de la remise du colis, pour confirmer votre identité.</p>
          <div className="mt-3 flex items-center justify-center rounded-xl bg-brand-50 py-4">
            <span className="font-mono text-3xl font-extrabold tracking-widest text-brand-700">{booking.confirmationCode}</span>
          </div>
        </Section>

        <Section title="📷 Preuve de livraison">
          {isDelivered ? (
            <div className="flex h-32 flex-col items-center justify-center gap-1 rounded-xl bg-emerald-50 text-emerald-700">
              <span className="text-2xl">🖼️</span>
              <span className="text-sm font-semibold">Photo de dépôt disponible</span>
            </div>
          ) : (
            <div className="flex h-32 flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-slate-300 text-slate-400">
              <span className="text-2xl">📷</span>
              <span className="text-sm">Disponible une fois la livraison effectuée</span>
            </div>
          )}
        </Section>
      </div>

      <div className="mt-6">
        <Section title="💳 Paiement">
          <PaymentPanel booking={booking} onPaid={() => setBooking(prev => (prev ? { ...prev, paymentStatus: 'paid' } : prev))} />
        </Section>
      </div>

      <div className="mt-6">
        <ExternalTrackingCard booking={booking} />
      </div>

      <div className="mt-6 flex justify-center">
        <SecondaryButton onClick={() => navigate('messaging', { carrierId: carrier.id })}>💬 Contacter {carrier.name}</SecondaryButton>
      </div>
    </div>
  );
}

function MessagingPage({ params }) {
  const nextParams = params.carrierId ? { carrierId: params.carrierId } : {};
  const { isAuthenticated, authLoading } = useRequireAuth('messaging', nextParams);
  const { authedFetch, token } = useAuth();
  const { navigate } = useApp2();
  const { getCarrierFromCache } = useData();

  const [conversations, setConversations] = useState([]);
  const [messagesByConv, setMessagesByConv] = useState({});
  const [activeId, setActiveId] = useState(null);
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);

  // Load (or create) the conversation for params.carrierId, plus the full list.
  useEffect(() => {
    if (authLoading || !isAuthenticated) return;
    let cancelled = false;
    setLoading(true);
    setError('');
    (async () => {
      try {
        let convs = await authedFetch('/messaging/conversations');
        if (params.carrierId && !convs.some(c => c.carrier_id === params.carrierId)) {
          const created = await authedFetch(`/messaging/conversations/${params.carrierId}`, { method: 'POST' });
          convs = [...convs, created];
        }
        if (cancelled) return;
        setConversations(convs);

        const entries = await Promise.all(convs.map(async c => {
          const msgs = await authedFetch(`/messaging/conversations/${c.id}/messages`);
          return [c.id, msgs];
        }));
        if (cancelled) return;
        setMessagesByConv(Object.fromEntries(entries));

        const preferred = params.carrierId ? convs.find(c => c.carrier_id === params.carrierId) : null;
        setActiveId((preferred || convs[0] || {}).id || null);
      } catch (err) {
        if (!cancelled) setError(err.message);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [params.carrierId, authLoading, isAuthenticated]);

  // Live updates for the active conversation only (matches the backend's per-conversation WS room).
  useEffect(() => {
    if (!token || !activeId) return;
    const ws = new WebSocket(`${WS_BASE}/ws/messaging/${activeId}?token=${encodeURIComponent(token)}`);
    ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        if (data.type === 'new_message') {
          setMessagesByConv(prev => {
            const existing = prev[activeId] || [];
            if (existing.some(m => m.id === data.id)) return prev;
            return { ...prev, [activeId]: [...existing, data] };
          });
        }
      } catch (e) { /* ignore malformed frames */ }
    };
    return () => ws.close();
  }, [token, activeId]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [activeId, messagesByConv]);

  async function handleSend() {
    if (!text.trim() || !activeId) return;
    setSending(true);
    const value = text.trim();
    setText('');
    try {
      const msg = await authedFetch(`/messaging/conversations/${activeId}/messages`, { method: 'POST', body: { text: value } });
      setMessagesByConv(prev => {
        const existing = prev[activeId] || [];
        if (existing.some(m => m.id === msg.id)) return prev;
        return { ...prev, [activeId]: [...existing, msg] };
      });
    } catch (err) {
      setError(err.message);
    } finally {
      setSending(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }

  if (authLoading || !isAuthenticated || loading) return <Spinner label="Chargement de la messagerie…" />;

  if (conversations.length === 0) {
    return (
      <div className="mx-auto max-w-2xl px-4 py-20 text-center">
        <p className="text-lg font-semibold text-slate-700">Aucune conversation pour l'instant.</p>
        <p className="mt-1 text-sm text-slate-500">Contactez un transporteur depuis sa fiche pour démarrer une conversation.</p>
        <SecondaryButton className="mt-4" onClick={() => navigate('search')}>Trouver un transporteur</SecondaryButton>
      </div>
    );
  }

  const sortedConvs = [...conversations].sort((a, b) => {
    const am = messagesByConv[a.id] || [];
    const bm = messagesByConv[b.id] || [];
    const at = am.length ? parseUTC(am[am.length - 1].created_at).getTime() : 0;
    const bt = bm.length ? parseUTC(bm[bm.length - 1].created_at).getTime() : 0;
    return bt - at;
  });

  const activeConv = conversations.find(c => c.id === activeId);
  const activeCarrier = activeConv ? getCarrierFromCache(activeConv.carrier_id) : null;
  const activeMsgs = messagesByConv[activeId] || [];

  return (
    <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
      <h1 className="mb-6 text-2xl font-extrabold text-slate-900">Messagerie</h1>
      <ErrorBanner message={error} />
      <div className="grid overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card lg:grid-cols-[300px_1fr]" style={{ minHeight: '560px' }}>
        <div className="border-b border-slate-200 lg:border-b-0 lg:border-r">
          <div className="max-h-[560px] overflow-y-auto msg-scroll">
            {sortedConvs.map(c => {
              const carrier = getCarrierFromCache(c.carrier_id);
              const msgs = messagesByConv[c.id] || [];
              const last = msgs[msgs.length - 1];
              return (
                <button key={c.id} onClick={() => setActiveId(c.id)}
                  className={cx('flex w-full items-center gap-3 border-b border-slate-100 p-4 text-left transition hover:bg-slate-50',
                    activeId === c.id && 'bg-brand-50')}>
                  <Avatar name={carrier ? carrier.name : '?'} initials={carrier ? carrier.initials : '?'} size={10} />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-semibold text-slate-800">{carrier ? carrier.name : 'Transporteur'}</p>
                    <p className="truncate text-xs text-slate-500">{last ? last.text : 'Aucun message — dites bonjour !'}</p>
                  </div>
                  {last && <span className="shrink-0 text-[10px] text-slate-400">{formatDateTime(last.created_at).split(' à ')[0]}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div className="flex flex-col">
          {activeCarrier && (
            <div className="flex items-center gap-3 border-b border-slate-200 p-4">
              <Avatar name={activeCarrier.name} initials={activeCarrier.initials} size={10} />
              <div className="min-w-0 flex-1">
                <p className="truncate text-sm font-bold text-slate-900">{activeCarrier.name}</p>
                <p className="text-xs text-slate-500">{activeCarrier.city} · répond en {activeCarrier.responseTime}</p>
              </div>
              <button onClick={() => navigate('carrier', { id: activeCarrier.id })} className="shrink-0 text-xs font-semibold text-brand-700 hover:underline">Voir le profil</button>
            </div>
          )}

          <div ref={scrollRef} className="msg-scroll flex-1 space-y-3 overflow-y-auto bg-slate-50 p-4" style={{ maxHeight: '420px' }}>
            {activeMsgs.length === 0 && (
              <p className="py-10 text-center text-sm text-slate-400">Aucun message pour l'instant. Envoyez le premier message{activeCarrier ? ` à ${activeCarrier.name}` : ''} !</p>
            )}
            {activeMsgs.map(m => (
              <div key={m.id} className={cx('flex', m.sender_role === 'client' ? 'justify-end' : 'justify-start')}>
                <div className={cx('max-w-[75%] rounded-2xl px-4 py-2.5 text-sm shadow-sm',
                  m.sender_role === 'client' ? 'rounded-br-sm bg-brand-600 text-white' : 'rounded-bl-sm bg-white text-slate-700')}>
                  <p>{m.text}</p>
                  <p className={cx('mt-1 text-[10px]', m.sender_role === 'client' ? 'text-brand-100' : 'text-slate-400')}>{formatDateTime(m.created_at)}</p>
                </div>
              </div>
            ))}
          </div>

          <div className="flex items-end gap-2 border-t border-slate-200 p-3">
            <textarea rows="1" value={text} onChange={e => setText(e.target.value)} onKeyDown={handleKeyDown}
              placeholder="Écrivez votre message…" className={cx(inputClass, 'resize-none')}></textarea>
            <PrimaryButton onClick={handleSend} className="!px-4 !py-2.5" disabled={!text.trim() || sending}>{sending ? '…' : 'Envoyer'}</PrimaryButton>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   APP ROOT + NAV CONTEXT
   ====================================================================== */

const Nav2Context = createContext(null);
function useApp2() { return useContext(Nav2Context); }

function Screen({ nav }) {
  switch (nav.screen) {
    case 'home': return <HomePage />;
    case 'search': return <SearchPage params={nav.params} />;
    case 'carrier': return <CarrierDetailPage params={nav.params} />;
    case 'booking': return <BookingPage params={nav.params} />;
    case 'login': return <LoginPage params={nav.params} />;
    case 'dashboard': return <DashboardPage />;
    case 'tracking': return <TrackingPage params={nav.params} />;
    case 'messaging': return <MessagingPage params={nav.params} />;
    default: return <HomePage />;
  }
}

function GlobalCityDatalist() {
  const { cityList } = useData();
  return <datalist id="city-list">{cityList.map(c => <option key={c} value={c} />)}</datalist>;
}

function AppShell() {
  const [nav, setNav] = useState(parseHash());

  useEffect(() => {
    function onHashChange() {
      setNav(parseHash());
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  function navigate(screen, params) {
    window.location.hash = buildHash(screen, params);
  }

  return (
    <Nav2Context.Provider value={{ nav, navigate }}>
      <div className="flex min-h-screen flex-col">
        <NavBar />
        <main className="flex-1">
          <Screen nav={nav} />
        </main>
        <Footer />
      </div>
      <GlobalCityDatalist />
    </Nav2Context.Provider>
  );
}

function App() {
  return (
    <AuthProvider>
      <DataProvider>
        <AppShell />
      </DataProvider>
    </AuthProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
